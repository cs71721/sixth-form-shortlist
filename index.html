<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Sixth form shortlist</title>
<style>
:root { --paper: #F4F6FB; --sheet: #FFFFFF; --ink: #141C36; --ink-2: #46506F; --rule: #DAE0EE; --pen: #2443C9; --pen-ink: #FFFFFF; --red: #B21D31; }
@media (prefers-color-scheme: dark) { :root { --paper: #0D1226; --sheet: #151B36; --ink: #E9EDF8; --ink-2: #B3BBD4; --rule: #29325A; --pen: #9DB1FF; --pen-ink: #0D1226; --red: #FF8E9C; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.lock { width: 100%; max-width: 380px; display: grid; gap: 14px; padding: 24px 20px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
h1 { margin: 0; font-size: 1.45rem; line-height: 1.2; }
p { margin: 0; color: var(--ink-2); }
.field { display: grid; gap: 6px; font-weight: 700; }
input[type="password"] { width: 100%; font: inherit; padding: 12px; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); }
.row { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .95rem; }
.row input { width: 18px; height: 18px; accent-color: var(--pen); }
button { font: inherit; font-weight: 700; min-height: 48px; padding: 12px; border: 0; border-radius: 8px; background: var(--pen); color: var(--pen-ink); cursor: pointer; }
button[disabled] { opacity: .65; cursor: progress; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }
.err { min-height: 1.5em; color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<form class="lock" id="lock">
  <h1>Sixth form shortlist</h1>
  <p>This page is private. Enter the password Dad sent you.</p>
  <label class="field" for="pw">Password
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
  </label>
  <label class="row" for="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
  <button id="go" type="submit">Open</button>
  <p class="err" id="err" role="alert"></p>
</form>
